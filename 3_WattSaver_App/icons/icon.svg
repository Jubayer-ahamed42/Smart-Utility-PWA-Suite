<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="electricBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#F59E0B" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#electricBg)"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="#38BDF8" stroke-width="8" opacity="0.3"/>
  <!-- Lightning Bolt -->
  <polygon points="270,80 140,260 250,260 210,432 372,220 262,220" fill="url(#boltGrad)" filter="url(#glow)"/>
</svg>